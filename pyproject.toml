[build-system]
requires = ["setuptools>=61,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smahd"
version = "0.1.0"
description = "Graph autoencoding for spatial multi-omics integration"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23,<2", "pandas>=1.5,<3", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.4,<2.5", "torch-geometric>=2.5,<2.6"]

[project.scripts]
smahd-train = "smahd.cli:main"

[project.optional-dependencies]
tutorials = ["jupyter", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["smahd*"]

[project.urls]
Repository = "https://github.com/JaySonWu-star/SMAHD"
